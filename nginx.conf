server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use relative redirects so a non-standard published port (e.g. 2216)
    # is preserved when nginx adds the trailing slash.
    absolute_redirect off;

    # CORS headers for NIP-05 endpoint
    location /.well-known/nostr.json {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers *;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Handle all other requests.
    # Serve directory index.html directly (without a 301 to a trailing slash)
    # so clean URLs work even behind a non-standard published port.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}