server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use relative redirects so a non-standard published port (e.g. 2216)
    # is preserved when nginx adds the trailing slash.
    absolute_redirect off;

    # Security headers. Set at the server level and inherited by locations
    # that do NOT declare their own add_header (that is why caching below
    # uses `expires` instead of add_header Cache-Control).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CORS headers for NIP-05 endpoint
    location = /.well-known/nostr.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1h;
        try_files $uri =404;
    }

    # Astro's content-hashed assets — safe to cache forever.
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Static media (images, audio, fonts, icons) — long cache.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|mp3|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # HTML and route fallback — always revalidate (expires -1 => no-cache).
    # Serve directory index.html directly (without a 301 to a trailing slash)
    # so clean URLs work even behind a non-standard published port.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        expires -1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
